<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>個人資料 - 學測複習站</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#201c2b">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="學測複習站">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="site-header">
  <a href="index.html" class="brand" aria-label="學測複習站 首頁">
    <span class="brand-mark" id="brand-mark"></span>
    <span class="brand-name">學測複習站</span>
  </a>
  <nav class="header-nav">
    <a href="index.html" class="nav-pill" id="nav-home">首頁</a>
    <a href="mockexam.html" class="nav-pill" id="nav-mockexam">模擬考</a>
    <a href="wrongbook.html" class="nav-pill" id="nav-wrongbook">錯題本</a>
  </nav>
  <div class="user-menu" id="user-menu"></div>
</header>
<main id="profile-content" class="container">
  <h1 class="profile-title">個人資料</h1>
  <div id="stats-tiles" class="stat-tile-grid"></div>
  <div id="encourage-card"></div>
  <section class="settings-card">
    <h2>讀書設定</h2>
    <div id="exam-date-form"></div>
  </section>
  <section>
    <h2>成就徽章</h2>
    <div id="achievements-summary-card"></div>
  </section>
  <div class="chart-grid">
    <section class="chart-card">
      <h2>各科完成度</h2>
      <div class="chart-canvas-wrap"><canvas id="chart-completion"></canvas></div>
    </section>
    <section class="chart-card">
      <h2>各科測驗正確率</h2>
      <div class="chart-canvas-wrap"><canvas id="chart-accuracy"></canvas></div>
    </section>
  </div>
  <section class="weak-units-section">
    <h2>最需要加強的單元</h2>
    <div id="weak-units" class="rail-list"></div>
  </section>
  <div class="dash-columns">
    <section class="dash-col">
      <h2>近期需複習</h2>
      <div id="review-list" class="timeline-list"></div>
    </section>
    <section class="dash-col">
      <h2>最近測驗紀錄</h2>
      <div id="recent-quizzes" class="rail-list"></div>
    </section>
  </div>
  <section>
    <h2>模擬考紀錄</h2>
    <div id="mockexam-history" class="rail-list"></div>
  </section>
  <!-- 網站版本號:每次上線更新。主版號=大改版、次版號=新功能或新內容、第三碼=只修錯。
       v1 8/31 上線、v2 9/5 歷屆試題與 PWA、v3 9/26 成就與介面大整理、v4 10/8 內容品質與課本對齊、v5 11/14 間隔複習。 -->
  <p class="app-version">v5.0</p>
</main>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script type="module" src="js/page-profile.js"></script>
</body>
</html>
